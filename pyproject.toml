[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cribworld"
version = "0.1.0"
description = "A simulated arm that learns from free play: motor babbling, curiosity and goal babbling compared in MuJoCo."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Tommaso Maggiolo", email = "maggiolotommaso@gmail.com"}]
requires-python = ">=3.10"
dependencies = ["mujoco>=3.2", "numpy", "torch", "pyyaml", "scipy", "matplotlib", "imageio", "pillow"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["cribworld"]

[tool.pytest.ini_options]
testpaths = ["tests"]
